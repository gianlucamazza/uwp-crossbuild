name: aur

# Publishes the AUR package when a v* tag is pushed, by running the same script
# a maintainer runs by hand — packaging/publish-aur.sh. Nothing here is
# workflow-only, so a release never depends on CI being available.
#
# Before the first run:
#   1. Register the package once at https://aur.archlinux.org (an empty repo is
#      created by the first push of a PKGBUILD; the account needs an SSH key).
#   2. Add the *private* half of that key as the AUR_SSH_KEY secret.
# Without the secret this workflow is skipped rather than failed: a release
# should not go red because a downstream package is not set up.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1.0"
        required: true
      dry_run:
        description: "Build and check, but do not push"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # makepkg exists only on Arch, and the official image is the smallest thing
    # that has it. base-devel brings fakeroot, which makepkg needs.
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Sy --noconfirm --needed git openssh pacman-contrib shellcheck

      - uses: actions/checkout@v7

      - name: Is the AUR key configured?
        id: key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then
            echo "AUR_SSH_KEY is not set — skipping publication."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: A user makepkg will run as
        # makepkg refuses to run as root, and a container is root by default.
        run: |
          useradd -m builder
          chown -R builder:builder .
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: SSH to the AUR
        if: steps.key.outputs.configured == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          install -d -m 700 -o builder -g builder /home/builder/.ssh
          # Created at 0600 before anything is written to it: `printf >` would
          # make it with the default umask and only narrow it afterwards.
          install -m 600 /dev/null /home/builder/.ssh/id_ed25519
          printf '%s\n' "$AUR_SSH_KEY" > /home/builder/.ssh/id_ed25519
          # Pinned rather than fetched: ssh-keyscan at run time would trust
          # whatever answers, which is the thing host keys exist to prevent.
          # Fingerprint SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4, as
          # published in the Arch wiki's AUR submission guidelines. Verify with:
          #   ssh-keygen -lf <(ssh-keyscan -t ed25519 aur.archlinux.org)
          cat > /home/builder/.ssh/known_hosts <<'EOF'
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          EOF
          chown -R builder:builder /home/builder/.ssh
          chmod 600 /home/builder/.ssh/known_hosts

      - name: Publish
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          DRY: ${{ (steps.key.outputs.configured != 'true' || inputs.dry_run) && '--dry-run' || '' }}
        run: |
          # github.ref_name is the tag, so strip the leading v.
          version="${VERSION#v}"
          echo "publishing $version $DRY"
          sudo -u builder --preserve-env=HOME env HOME=/home/builder \
            packaging/publish-aur.sh --version "$version" $DRY
