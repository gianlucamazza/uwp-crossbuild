name: ci

# Deliberately does not build anything. A real build downloads ~1.1 GB of
# Windows SDK and CRT from Microsoft's CDN, which the licence permits but which
# has no business running on every push. What runs here is everything that can
# be checked without it — see tests/run-tests.sh for what that means, and
# `full-build` below for the job that does the rest, on request.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Every workaround here is tied to a version of LLVM, Wine, xwin or the SDK,
  # and all four move underneath this repository without a commit. A monthly
  # full build is the only thing that notices — either that one has broken, or
  # that one has been fixed and the workaround can go.
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: read

env:
  # Pinned here rather than in the steps: dependabot watches the actions, not
  # these, so a human bumps them and should only have to look in one place.
  XWIN_VERSION: "0.9.0"
  SHFMT_VERSION: "3.12.0"

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax
        run: |
          for f in scripts/*.sh tests/*.sh packaging/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/*.py

      - name: shellcheck
        run: shellcheck scripts/*.sh tests/*.sh packaging/*.sh

      - name: shfmt
        run: |
          # --fail, or a 404 is saved as the binary and runs as garbage.
          curl -sSL --fail -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          /tmp/shfmt -d scripts/*.sh tests/*.sh packaging/*.sh

      - name: Tests
        run: tests/run-tests.sh

      - name: Install, then run what was installed
        # The consumer surface rots silently otherwise. These scripts locate
        # include/msvc-compat.h relative to themselves, so anything that
        # installs them individually — or any new file they start reading —
        # breaks outside a checkout while every in-tree test still passes.
        run: |
          make install PREFIX=/tmp/prefix
          test -x /tmp/prefix/bin/uwp-build
          # Run from elsewhere, through the symlink, with no checkout in sight.
          cd /tmp
          /tmp/prefix/bin/uwp-build 2>&1 | grep -q "\-\-out is required"
          /tmp/prefix/bin/uwp-build-app --project /nonexistent --out /tmp/x 2>&1 \
            | grep -q "no app.idl"
          # build-project.sh finds read-vcxproj.py beside itself, which is the
          # thing an installed tree gets wrong.
          /tmp/prefix/bin/uwp-build-project --project /nonexistent.vcxproj \
            --out /tmp/x 2>&1 | grep -q "no such project"
          test -f /tmp/prefix/lib/uwp-crossbuild/include/msvc-compat.h
          cd "$GITHUB_WORKSPACE"
          make uninstall PREFIX=/tmp/prefix
          # -type l as well: what uninstall has to remove from bin/ *is* symlinks,
          # and -type f alone would call a dangling one a clean uninstall.
          test -z "$(find /tmp/prefix \( -type f -o -type l \))"

      - name: The PKGBUILD agrees with the tree
        run: |
          for script in scripts/*.sh scripts/*.py; do
            grep -q "$(basename "$script")" Makefile ||
              { echo "$script is not installed by the Makefile"; exit 1; }
          done
          grep -q "pkgver=$(sed -n 's/^## \([0-9.]*\) .*/\1/p' CHANGELOG.md | head -1)" \
            packaging/PKGBUILD || { echo "PKGBUILD pkgver != CHANGELOG"; exit 1; }

      - name: Every script is executable
        # A script that loses its +x bit still works via `bash x.sh` and fails
        # for anyone following the README.
        run: |
          for f in scripts/*.sh scripts/*.py tests/*.sh packaging/*.sh; do
            # common.sh is sourced by the others and never run. Executable, it
            # would look like a command and get a symlink it has no use for.
            [ "$f" = scripts/common.sh ] && continue
            [ -x "$f" ] || { echo "not executable: $f"; exit 1; }
          done

  full-build:
    # The real thing: SDK, CRT, and a UWP application compiled end to end. Not
    # on every push — it is a 1.1 GB download and ~10 minutes — but on request
    # and once a month, because the toolchain moves and this repository is a
    # record of how it behaves.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld wine wine64 winetricks p7zip-full

      - name: Cache the SDK
        # Not on the scheduled run: that one exists to find out whether the
        # download path still works, and a cache hit is exactly what would hide
        # Microsoft moving the installer or changing the layout.
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: ~/.cache/uwp-crossbuild
          key: sdk-${{ hashFiles('scripts/fetch-sdk.sh') }}

      - name: What is missing
        run: scripts/check-deps.sh || true

      - name: CRT and SDK headers
        # Before fetch-sdk.sh, which reads the C++/WinRT version out of these
        # headers to pin cppwinrt.exe. The other order leaves it guessing, and a
        # mismatch fails every build on a static_assert.
        run: |
          # --fail, or a 404 arrives as a tarball tar cannot read, blaming tar.
          # pipefail because the default shell here does not set it, and curl is
          # not the last command in the pipe.
          set -o pipefail
          curl -sSL --fail \
            "https://github.com/Jake-Shadle/xwin/releases/download/${XWIN_VERSION}/xwin-${XWIN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp --strip-components=1
          # --cache-dir, or xwin leaves a 424 MB .xwin-cache in the checkout.
          /tmp/xwin --accept-license --arch x86_64 \
            --cache-dir ~/.cache/uwp-crossbuild/xwin-download \
            splat --output ~/.cache/uwp-crossbuild/xwin
          scripts/fix-header-case.sh ~/.cache/uwp-crossbuild/xwin/sdk/include/cppwinrt/winrt --canonical

      - name: SDK tools
        run: |
          winetricks -q msxml6
          scripts/fetch-sdk.sh

      - name: Build the console example
        run: scripts/build.sh --out /tmp/hello.exe examples/hello-winrt/app.cpp

      - name: Build the UWP example
        run: scripts/build-app.sh --project examples/hello-uwp --out /tmp/hello-layout

      - name: The layout holds only what ships
        # Everything in a layout goes into the package, and makepri indexes it:
        # a projection or an object left in there is shipped and described in
        # resources.pri. The build directory beside it is where they belong.
        run: |
          unexpected=$(find /tmp/hello-layout \
            \( -name '*.obj' -o -name '*.pch' -o -name '*.g.h' \
               -o -name '*.g.cpp' -o -name 'gen' -o -name '.gen' \) -print)
          [ -z "$unexpected" ] || { echo "not shippable: $unexpected"; exit 1; }
          test -d /tmp/hello-layout.build/gen

      - name: The executable is linked for the app container
        # 0x1000 is IMAGE_DLLCHARACTERISTICS_APPCONTAINER. Without it a device
        # refuses the package, and nothing on a build host notices.
        run: |
          value=$(objdump -p /tmp/hello-layout/hello.exe |
                  awk '/DllCharacteristics/ {print $2}')
          echo "DllCharacteristics=$value"
          [ $((0x$value & 0x1000)) -ne 0 ] || { echo "not an app-container image"; exit 1; }

      - name: The layout is packable
        run: |
          pip install openappx
          openappx validate --root /tmp/hello-layout
          openappx pack --root /tmp/hello-layout --out /tmp/hello.msix
          openappx inspect --package /tmp/hello.msix
